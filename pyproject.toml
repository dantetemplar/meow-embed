[project]
name = "meow-embed"
version = "0.1.2"
description = "FastAPI embedding server and async Python client for dense and sparse text embeddings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = [
    "FlagEmbedding>=1.4.2",
    "einops>=0.8.2",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
]
client = [
    "httpx>=0.28.1",
    "lmdb>=3.0.0",
    "numpy>=2.5.3",
]
all = [
    "FlagEmbedding>=1.4.2",
    "einops>=0.8.2",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "lmdb>=3.0.0",
]

[project.scripts]
meow-embed = "meow_embed.cli:main"

[dependency-groups]
dev = [
    "ir-datasets>=0.6.3",
    "mypy>=2.4.0",
    "mypy-test>=0.1.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.uv]
constraint-dependencies = ["urllib3>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
